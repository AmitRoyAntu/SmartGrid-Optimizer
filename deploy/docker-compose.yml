# =============================================================================
# GridWise LLM — Local Development Runner
# Usage:
#   1. cp .env.example .env       # then fill in your GROQ_API_KEY
#   2. docker compose -f deploy/docker-compose.yml up --build
#   3. curl http://localhost:8000/health
# =============================================================================

services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: smartgrid-optimizer:local
    container_name: smartgrid-optimizer
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      # Defaults — overridden by values in .env if present
      APP_ENV: production
      LOG_LEVEL: INFO
      LLM_TIMEOUT_SEC: "4.0"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    # Resource limits — keeps the local runner from eating your laptop
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 768M
